<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- models-from-wb：左侧 dsh 圆角方 → 右侧 WorkBuddy 圆角方，中间两道箭头 = 本地桥 -->
  <defs>
    <linearGradient id="wbgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="20" width="20" height="24" rx="5" fill="#1f2937"/>
  <text x="14" y="37" font-family="-apple-system, sans-serif" font-size="12" font-weight="700"
        fill="#ffffff" text-anchor="middle">ds</text>
  <rect x="40" y="20" width="20" height="24" rx="5" fill="url(#wbgrad)"/>
  <text x="50" y="37" font-family="-apple-system, sans-serif" font-size="12" font-weight="700"
        fill="#ffffff" text-anchor="middle">wb</text>
  <!-- 桥：往返两道箭头 -->
  <path d="M26 28 L38 28" stroke="#4d6bfe" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 25 L38 28 L35 31" fill="none" stroke="#4d6bfe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 36 L26 36" stroke="#7a5cff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M29 33 L26 36 L29 39" fill="none" stroke="#7a5cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
