# ============================================================================
# models-from-wb —— bundle patch
#
# 只做一件事：把本插件的 Loader 条目插进配置树。
#   - id   是「条目 id」，用户可用同一个 id 在自己的
#          $DSH_HOME/profiles/<profile>/cordis.patch.yml 里覆盖 config；
#   - name 是包名，由 profile 的 node_modules 解析。
#
# 这里不动任何官方条目：模型路由由插件的宿主端在运行时用
# ctx.llm.registerAdapter() 注册，不写 settings.yaml。
# ============================================================================

- insert:
    - id: models-from-wb
      name: models-from-wb
      config:
        provider: workbuddy
        displayName: WorkBuddy
        host: 127.0.0.1
        port: 8790
        autoStart: true
